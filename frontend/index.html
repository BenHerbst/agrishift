<!doctype html>
<html lang="en" >
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terra Tuta · Farm climate analytics with NASA data</title>
    <meta
      name="description"
      content="Standortbezogene Auswertung von NASA POWER Wetterdaten (1990–2025), ISRIC-Bodenprofilen und angepassten Fruchtfolgen."
    />
    <meta property="og:title" content="Terra Tuta — Klimaverlauf &amp; Fruchtfolgeplanung" />
    <meta
      property="og:description"
      content="Lokale Klimatrends seit 1990 auswerten und passende Fruchtfolgen für Ackerstandorte planen."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Theme before first paint: saved choice, else the system setting
      try {
        var saved = localStorage.getItem('terra-tuta-theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body class="bg-ground text-ink antialiased selection:bg-crop/30 selection:text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
