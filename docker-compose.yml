# Coolify: Docker Compose build pack. Assign the domain to the "frontend" service (port 3000).
services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - backend_cache:/app/data_cache
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - frontend_cache:/app/.cache
    depends_on:
      - backend
volumes:
  backend_cache:
  frontend_cache:
